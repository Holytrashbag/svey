name: Release Please

# Keeps a release PR open that collects merged commits into CHANGELOG.md and
# bumps the version. Merging that PR tags vX.Y.Z and publishes the GitHub
# release. Versions document what shipped; deploys still happen on every merge.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
