name: CI

# Lint, type-check, test and build the whole monorepo. Runs on pull requests
# (required to merge) and on main, and is reused by deploy.yml as a gate before
# shipping.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint · types · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Type-check
        run: pnpm check-types

      # API tests read apps/api/.env.test; nothing needs a database.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
