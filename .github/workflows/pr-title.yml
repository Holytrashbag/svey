name: PR title

# PRs are squash-merged and the title becomes the commit on main, which
# release-please turns into the changelog — so it must be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            test
            build
            ci
            chore
          # Lower-case start, e.g. "feat(tracker): persist life totals".
          # Dependabot always writes "Bump ..." and can't be configured not to.
          subjectPattern: ^(?:(?![A-Z])|Bump ).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lower-case letter.
